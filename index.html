<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>鹈鹕骑自行车 · 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --glass: rgba(18, 22, 33, 0.55);
    --stroke: rgba(255,255,255,0.14);
    --accent: #ff8c1a;
    --text: #eef3fb;
    --muted: #9fb0c7;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0a0e16; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #scene{ position:fixed; inset:0; display:block; width:100%; height:100%; }

  .panel{
    position:fixed; z-index:10;
    background:var(--glass);
    border:1px solid var(--stroke);
    border-radius:14px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  #title{ top:18px; left:18px; padding:14px 18px; max-width:62vw; }
  #title h1{ margin:0; font-size:18px; letter-spacing:.5px; }
  #title p{ margin:6px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5; }
  #fps{ margin-top:8px; font-size:11px; color:var(--accent); font-variant-numeric:tabular-nums; }

  #controls{ left:18px; bottom:18px; padding:14px 16px; width:264px; }
  #controls .row{ display:flex; align-items:center; justify-content:space-between; margin:10px 0; gap:10px; }
  #controls label{ font-size:13px; color:var(--text); }
  #controls .hint{ font-size:11px; color:var(--muted); margin-top:2px; }
  input[type="range"]{ width:130px; accent-color:var(--accent); }
  .btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  button{
    flex:1 1 auto; min-width:74px;
    background:rgba(255,255,255,0.06);
    color:var(--text);
    border:1px solid var(--stroke);
    border-radius:9px; padding:8px 6px;
    font-size:12px; cursor:pointer; transition:.15s;
  }
  button:hover{ background:rgba(255,255,255,0.12); }
  button.on{ background:var(--accent); color:#1a1207; border-color:var(--accent); font-weight:600; }

  #hint{ right:18px; bottom:18px; padding:10px 14px; font-size:12px; color:var(--muted); }

  #loader{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; gap:16px;
    align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #16203a, #070b12);
    transition:opacity .6s ease;
  }
  .spinner{ width:46px; height:46px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loader span{ font-size:13px; color:var(--muted); letter-spacing:1px; }

  #err{ position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center;
    background:#0a0e16; color:#ffb4b4; font-size:14px; line-height:1.7; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="title" class="panel">
    <h1>🐦 鹈鹕骑自行车 · 3D</h1>
    <p>Three.js 程序化建模 · 实时动画 · 程序化环境光照 · 阴影 · ACES 色调映射</p>
    <div id="fps">初始化中…</div>
  </div>

  <div id="controls" class="panel">
    <div class="row">
      <div>
        <label>骑行速度</label>
        <div class="hint">控制踏频 / 车轮 / 路面流动</div>
      </div>
      <input id="speed" type="range" min="0" max="3" step="0.05" value="1.2" />
    </div>
    <div class="btns">
      <button id="bRotate" class="on">自动环绕</button>
      <button id="bFlap" class="on">扇翅膀</button>
    </div>
    <div class="btns">
      <button id="bNight">昼夜切换</button>
      <button id="bPerf">性能模式</button>
    </div>
  </div>

  <div id="hint" class="panel">拖拽旋转视角 · 滚轮缩放 · 右键平移</div>

  <div id="loader">
    <div class="spinner"></div>
    <span>正在加载 3D 场景…</span>
  </div>

  <div id="err"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
